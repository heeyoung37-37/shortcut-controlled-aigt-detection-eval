domains:
  essay:
    source_dataset: chillies/IELTS-writing-task-2-evaluation
    hf_dataset: chillies/IELTS-writing-task-2-evaluation
    hf_config: null
    split: train
    trust_remote_code: false
    min_words: 120
    task_fields: [prompt]
    text_field: essay
    metadata_fields: [band]
  arxiv_abstract:
    source_dataset: gfissore/arxiv-abstracts-2021
    hf_dataset: gfissore/arxiv-abstracts-2021
    hf_config: null
    split: train
    trust_remote_code: false
    min_words: 55
    task_fields: [title, categories, comments]
    text_field: abstract
    metadata_fields: [id, authors, title, categories, comments, doi, journal-ref]
  blog:
    source_dataset: Kamaljp/medium_articles
    hf_dataset: Kamaljp/medium_articles
    hf_config: null
    split: train
    trust_remote_code: false
    min_words: 80
    task_fields: [title, tags, authors, timestamp, url]
    text_field: text
    metadata_fields: [title, url, authors, timestamp, tags]
  product_review:
    source_dataset: McAuley-Lab/Amazon-Reviews-2023
    hf_dataset: McAuley-Lab/Amazon-Reviews-2023
    hf_config: raw_review_All_Beauty
    split: full
    trust_remote_code: true
    parquet_files:
      - https://huggingface.co/datasets/McAuley-Lab/Amazon-Reviews-2023/resolve/5acac39e35c0d3c5b712abbec6f7dcebb89254e4/raw_review_All_Beauty/full-00000-of-00001.parquet
    min_words: 70
    task_fields: [rating, title, verified_purchase, helpful_vote, parent_asin]
    text_field: text
    metadata_fields: [rating, title, asin, parent_asin, verified_purchase, helpful_vote, timestamp]
  peer_review:
    source_dataset: allenai/peer_read
    hf_dataset: allenai/peer_read
    hf_config: reviews
    split: train
    trust_remote_code: true
    peerread_github_zip: https://github.com/allenai/PeerRead/archive/master.zip
    min_words: 60
    task_fields: [title, abstract, accepted, subjects]
    text_field: comments
    metadata_fields: [id, conference, title, accepted, subjects, recommendation, originality, clarity, substance, soundness_correctness, impact]
  meeting_summary:
    source_dataset: huuuyeah/meetingbank
    hf_dataset: huuuyeah/meetingbank
    hf_config: null
    split: train
    trust_remote_code: false
    min_words: 70
    task_fields: [uid, transcript]
    text_field: summary
    transcript_field: transcript
    max_transcript_words: 1800
    metadata_fields: [id, uid]
  translation:
    source_dataset: HuggingFaceFW/finetranslations
    hf_dataset: HuggingFaceFW/finetranslations
    hf_configs: [spa_Latn, fra_Latn, jpn_Jpan]
    language_names:
      spa_Latn: Spanish
      fra_Latn: French
      jpn_Jpan: Japanese
    split: train
    trust_remote_code: false
    min_words: 55
    source_text_field: og_full_text
    text_field: translated_text
    metadata_fields: [id, og_language, og_token_count, translated_token_count, edu_score]
    min_translated_words: 60
    max_translated_words: 220
    max_segments: 4
